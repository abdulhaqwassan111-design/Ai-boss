<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Boss Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#202123;
color:#fff;
height:100vh;
overflow:hidden;
}

.app{
display:flex;
height:100vh;
}

.sidebar{
width:260px;
background:#171717;
padding:20px;
display:flex;
flex-direction:column;
}

.logo{
font-size:28px;
font-weight:bold;
color:#19c2ff;
margin-bottom:20px;
}

button{
cursor:pointer;
}

.new-chat{
width:100%;
padding:14px;
background:#19c2ff;
color:#000;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
margin-bottom:20px;
}

.new-chat:hover{
background:#00ff99;
}

.history-title{
color:#aaa;
margin:10px 0;
}

.history{
flex:1;
background:#222;
padding:10px;
border-radius:10px;
overflow:auto;
color:#aaa;
}

.menu a{
display:block;
padding:12px;
margin-top:10px;
background:#222;
border-radius:10px;
color:white;
text-decoration:none;
}

.main{
flex:1;
display:flex;
flex-direction:column;
background:#343541;
}

.topbar{
height:65px;
background:#202123;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

.messages{
flex:1;
overflow-y:auto;
padding:20px;
}

.ai-message,
.user-message{
display:flex;
margin-bottom:15px;
animation:show .3s ease;
}

@keyframes show{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.avatar{
font-size:28px;
margin-right:10px;
}

.bubble{
background:#444654;
padding:14px;
border-radius:12px;
max-width:80%;
line-height:1.5;
}

.user-message{
justify-content:flex-end;
}

.user-message .bubble{
background:#19c2ff;
color:#000;
}
  .input-area{
display:flex;
padding:15px;
background:#202123;
gap:10px;
}

.input-area input{

flex:1;
padding:15px;
border:none;
border-radius:10px;
background:#40414f;
color:white;
font-size:16px;
outline:none;

}


.send-btn,
.voice-btn,
.listen-btn{

width:55px;
height:55px;
border:none;
border-radius:10px;
background:#19c2ff;
font-size:20px;

}


.send-btn:hover,
.voice-btn:hover,
.listen-btn:hover{

background:#00ff99;

}


.typing{

color:#aaa;
font-style:italic;

}


@media(max-width:768px){

.sidebar{

display:none;

}

.main{

width:100%;

}

}

</style>

</head>


<body>


<div class="app">


<div class="sidebar">

<div class="logo">
🤖 AI Boss
</div>


<button class="new-chat" onclick="newChat()">
➕ New Chat
</button>


<div class="history-title">
History
</div>


<div id="history" class="history">
No previous chats
</div>


<div class="menu">

<a href="index.html">🏠 Home</a>

<a href="image.html">🖼️ AI Image</a>

<a href="profile.html">👤 Profile</a>

<a href="settings.html">⚙️ Settings</a>

</div>


</div>



<div class="main">


<div class="topbar">

<h2>🤖 AI Boss</h2>

<div style="color:#00ff99;">
🟢 Online
</div>

</div>



<div id="messages" class="messages">


<div class="ai-message">

<div class="avatar">
🤖
</div>

<div class="bubble">
Hello! I'm <b>AI Boss</b>.<br>
How can I help you?
</div>

</div>


</div>



<div class="input-area">


<input id="text"
placeholder="Message AI Boss..."
onkeydown="if(event.key==='Enter') send();">


<button class="send-btn" onclick="send()">
➤
</button>


<button class="voice-btn" onclick="startVoice()">
🎤
</button>


<button class="listen-btn" onclick="speakReply()">
🔊
</button>


</div>


</div>


</div>
  <script>

let lastReply="";

const messages=document.getElementById("messages");


function addMessage(text,type){

let div=document.createElement("div");

div.className=type+"-message";


if(type==="ai"){

div.innerHTML=`
<div class="avatar">🤖</div>
<div class="bubble">${text}</div>
`;

}else{

div.innerHTML=`
<div class="bubble">${text}</div>
`;

}


messages.appendChild(div);

messages.scrollTop=messages.scrollHeight;

}



async function send(){

const input=document.getElementById("text");

let text=input.value.trim();


if(text==="") return;


addMessage(text,"user");

input.value="";


let typing=document.createElement("div");

typing.className="ai-message";

typing.innerHTML=`
<div class="avatar">🤖</div>
<div class="bubble typing">
AI Boss is typing...
</div>
`;

messages.appendChild(typing);


try{


const response=await fetch("/api/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

message:text

})

});


const data=await response.json();


messages.removeChild(typing);


lastReply=data.reply || "No response";


addMessage(lastReply,"ai");


localStorage.setItem(
"AI_Boss_Chat",
messages.innerHTML
);


document.getElementById("history").innerHTML=
"✅ Previous Chat Saved";


}

catch{


messages.removeChild(typing);

addMessage(
"❌ Server Error",
"ai"
);

}


}




function newChat(){

messages.innerHTML=`

<div class="ai-message">

<div class="avatar">🤖</div>

<div class="bubble">
Hello! I'm <b>AI Boss</b>.<br>
How can I help you?
</div>

</div>

`;


localStorage.removeItem("AI_Boss_Chat");

document.getElementById("history").innerHTML=
"No previous chats";

}




function startVoice(){

const SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!SpeechRecognition){

alert("Voice not supported");

return;

}


const recognition=new SpeechRecognition();

recognition.lang="en-US";

recognition.start();


recognition.onresult=function(e){

document.getElementById("text").value=
e.results[0][0].transcript;

};


}




function speakReply(){

if(lastReply===""){

alert("No AI reply");

return;

}


let speech=new SpeechSynthesisUtterance(lastReply);

speech.lang="en-US";

window.speechSynthesis.speak(speech);

}




window.onload=function(){

let old=localStorage.getItem("AI_Boss_Chat");


if(old){

messages.innerHTML=old;

document.getElementById("history").innerHTML=
"✅ Previous Chat Saved";

}

};


</script>


</body>

</html>
