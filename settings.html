<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Boss - Settings</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:white;
transition:.3s;
}

body.light{
background:white;
color:#111;
}


.card{

width:90%;
max-width:420px;
margin:30px auto;
padding:20px;
background:#1a1a1a;
border-radius:15px;
box-shadow:0 0 20px rgba(0,212,255,.3);

}


body.light .card{
background:#f3f3f3;
}


h1{

text-align:center;
margin-bottom:20px;
color:#00d4ff;

}


button,.btn{

width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
background:#00d4ff;
color:#000;
font-size:16px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
display:block;
text-align:center;

}


button:hover,.btn:hover{

background:#00ff99;
transform:scale(1.03);

}


#languageBox{

display:none;
margin-top:15px;

}


#searchLang{

width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;

}


#languageList{

width:100%;
height:180px;
border-radius:8px;

}

</style>

</head>


<body>


<div class="card">


<h1>⚙️ AI Boss Settings</h1>


<button onclick="toggleDarkMode()">
🌙 Dark Mode
</button>


<button onclick="toggleNotifications()">
🔔 Notifications
</button>


<button onclick="selectModel()">
🤖 AI Model
</button>


<button onclick="voiceSettings()">
🎙️ Voice Settings
</button>


<button onclick="clearChat()">
🗑️ Clear Chat
</button>
<button onclick="showLanguages()">
🌐 Language
</button>


<div id="languageBox">


<input id="searchLang"
placeholder="Search Language..."
onkeyup="searchLanguage()">



<select id="languageList" size="8">

<option>English</option>
<option>Urdu</option>
<option>Hindi</option>
<option>Sindhi</option>
<option>Arabic</option>
<option>Chinese</option>
<option>Spanish</option>
<option>French</option>
<option>German</option>

</select>


</div>



<a class="btn" href="profile.html">
⬅ Back to Profile
</a>


</div>
<script>

function toggleDarkMode(){

document.body.classList.toggle("light");

}


function toggleNotifications(){

let status = localStorage.getItem("AI_Boss_Notifications");


if(status === "on"){

localStorage.setItem("AI_Boss_Notifications","off");

alert("🔕 Notifications Off");

}

else{

localStorage.setItem("AI_Boss_Notifications","on");

alert("🔔 Notifications On");

}

}



function selectModel(){

let model = prompt(
"Choose AI Model:\n1. GPT-4.1 Mini\n2. GPT-5\n3. AI Boss Basic"
);


if(model){

localStorage.setItem("AI_Model",model);

alert("🤖 AI Model Saved");

}

}



function voiceSettings(){

let voice = prompt(
"Voice Settings:\n1. Male Voice\n2. Female Voice\n3. Default"
);


if(voice){

localStorage.setItem("AI_Voice",voice);

alert("🎙️ Voice Setting Saved");

}

}



function clearChat(){

localStorage.removeItem("AI_Boss_Chat");

alert("🗑️ Chat History Cleared");

}




function showLanguages(){

let box = document.getElementById("languageBox");


if(box.style.display === "block"){

box.style.display="none";

}

else{

box.style.display="block";

}

}




function searchLanguage(){

let input =
document.getElementById("searchLang").value.toLowerCase();


let options =
document.getElementById("languageList").options;



for(let i=0;i<options.length;i++){

let text =
options[i].text.toLowerCase();


options[i].style.display =
text.includes(input) ? "" : "none";

}


}


</script>


</body>

</html>
